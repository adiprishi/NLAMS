<!DOCTYPE html>
<html>

<head>

    <title>NLAMS - Add Land Parcel</title>

    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        .header {
            background: #172033;
            color: white;
            padding: 20px 30px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="header">
    <h2>NLAMS - Add Land Parcel</h2>
</div>

<div class="container">

    <h2>Land Parcel Information</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Project</label>

        <select name="project" required>

            <option value="">Select Project</option>

            {% for project in projects %}

            <option value="{{ project.id }}">
                {{ project.project_name }}
            </option>

            {% endfor %}

        </select>


        <label>Parcel ID</label>

        <input
            type="text"
            name="parcel_id"
            placeholder="Example: ASSAM-KAM-004"
            required
        >


        <label>Owner Name</label>

        <input
            type="text"
            name="owner_name"
            placeholder="Enter land owner name"
            required
        >


        <label>Area (Acres)</label>

        <input
            type="number"
            name="area"
            step="0.01"
            required
        >


        <label>Latitude</label>

        <input
            type="number"
            name="latitude"
            step="0.000001"
            placeholder="Example: 26.1445"
            required
        >


        <label>Longitude</label>

        <input
            type="number"
            name="longitude"
            step="0.000001"
            placeholder="Example: 91.7362"
            required
        >

        <label>Parcel Boundary</label>

<p style="color:#666; font-size:14px;">
    Use the polygon tool on the map to draw the exact parcel boundary.
</p>

<div
    id="parcel-map"
    style="
        height: 450px;
        width: 100%;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
    "
></div>

<input
    type="hidden"
    name="boundary"
    id="boundary"
>


        <label>Acquisition Status</label>

        <select name="status" required>

            <option value="IDENTIFIED">Identified</option>
            <option value="VERIFIED">Verified</option>
            <option value="NOTIFIED">Notified</option>
            <option value="ACQUIRED">Acquired</option>
            <option value="POSSESSION">Possession Taken</option>

        </select>


        <button type="submit">
            Save Land Parcel
        </button>

    </form>

    <a href="{% url 'land_parcels' %}" class="back">
        ← Back to Land Parcels
    </a>

</div>

<script>

    var defaultLat = 26.1445;
    var defaultLng = 91.7362;

    var map = L.map('parcel-map').setView(
        [defaultLat, defaultLng],
        13
    );

    L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        {
            attribution: 'Tiles &copy; Esri'
        }
    ).addTo(map);


    // Layer containing the parcel being drawn
    var drawnItems = new L.FeatureGroup();

    map.addLayer(drawnItems);


    // Drawing controls
    var drawControl = new L.Control.Draw({

        edit: {
            featureGroup: drawnItems
        },

        draw: {
            polygon: true,
            rectangle: true,
            polyline: false,
            circle: false,
            circlemarker: false,
            marker: false
        }

    });

    map.addControl(drawControl);


    // When a polygon is finished
    map.on(L.Draw.Event.CREATED, function(event) {

        var layer = event.layer;

        // Only allow one parcel boundary
        drawnItems.clearLayers();

        drawnItems.addLayer(layer);


        // Convert Leaflet coordinates to JSON
        var coordinates = layer.getLatLngs()[0].map(function(point) {

            return [
                point.lat,
                point.lng
            ];

        });


        // Store boundary in hidden form field
        document.getElementById('boundary').value =
            JSON.stringify(coordinates);

    });


    // When the boundary is edited
    map.on(L.Draw.Event.EDITED, function(event) {

        event.layers.eachLayer(function(layer) {

            var coordinates =
                layer.getLatLngs()[0].map(function(point) {

                    return [
                        point.lat,
                        point.lng
                    ];

                });

            document.getElementById('boundary').value =
                JSON.stringify(coordinates);

        });

    });


    // When the boundary is deleted
    map.on(L.Draw.Event.DELETED, function() {

        document.getElementById('boundary').value = '';

    });


    // Update map when latitude/longitude are entered
    function updateMapLocation() {

        var lat =
            parseFloat(
                document.querySelector('[name="latitude"]').value
            );

        var lng =
            parseFloat(
                document.querySelector('[name="longitude"]').value
            );

        if (!isNaN(lat) && !isNaN(lng)) {

            map.setView(
                [lat, lng],
                16
            );

        }

    }


    document
        .querySelector('[name="latitude"]')
        .addEventListener(
            'change',
            updateMapLocation
        );

    document
        .querySelector('[name="longitude"]')
        .addEventListener(
            'change',
            updateMapLocation
        );

</script>

</body>

</html>
