<!DOCTYPE html>
<html>
<head>
    <title>NLAMS - Land Parcel Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #172033;
            color: white;
            padding: 18px 25px;
        }

        .header h2 {
            margin: 0;
        }

        .map-container {
            padding: 20px;
        }

        .info {
            margin-bottom: 15px;
        }

        .info h3 {
            margin-bottom: 5px;
        }

        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* Popup styling */
        .parcel-popup {
            font-size: 14px;
            line-height: 1.7;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>NLAMS - GIS Land Parcel Map</h2>
</div>

<div class="map-container">

    <div class="info">
        <h3>Land Parcels</h3>
        <p>
            Interactive GIS visualization of land parcels and
            acquisition status.
        </p>
    </div>

    <div id="map"></div>

    <div id="parcel-data" hidden>

        {% for parcel in parcels %}

            <div
    class="parcel"
    data-latitude="{{ parcel.latitude }}"
    data-longitude="{{ parcel.longitude }}"
    data-parcel-id="{{ parcel.parcel_id|escape }}"
    data-owner="{{ parcel.owner_name|escape }}"
    data-area="{{ parcel.area|escape }}"
    data-status="{{ parcel.get_status_display|escape }}"
data-boundary="{{ parcel.boundary|escapejs }}"
data-assessed="{{ parcel.compensation.first.assessed_amount|default:0 }}"
data-paid="{{ parcel.compensation.first.paid_amount|default:0 }}"
data-payment-status="{{ parcel.compensation.first.get_payment_status_display|default:'No Record' }}"
data-possession-status="{{ parcel.possession.first.get_possession_status_display|default:'No Record' }}"
data-possession-date="{{ parcel.possession.first.possession_date|default:'Not Taken' }}"
data-rr-count="{{ parcel.project.rr_cases.count }}"
></div>

        {% endfor %}

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

    // ==========================================
    // INITIALIZE MAP
    // ==========================================

    var map = L.map('map').setView(
        [26.1445, 91.7362],
        12
    );


    // ==========================================
// BASE MAPS
// ==========================================

var streetLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri'
    }
);

var satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri'
    }
);

// Start with the normal street map
streetLayer.addTo(map);

// Map / Satellite switcher
var baseMaps = {
    "Map": streetLayer,
    "Satellite": satelliteLayer
};

L.control.layers(baseMaps).addTo(map);


    // ==========================================
    // STATUS COLORS
    // ==========================================

    function getParcelColor(status) {

        if (status === 'Identified') {
            return '#f1c40f';
        }

        if (status === 'Verified') {
            return '#3498db';
        }

        if (status === 'Notified') {
            return '#f39c12';
        }

        if (status === 'Acquired') {
            return '#ff1744';
        }

        if (status === 'Possession Taken') {
            return '#8e44ad';
        }

        return '#7f8c8d';
    }


    // ==========================================
    // LOAD PARCELS
    // ==========================================

    var allParcels = [];


    document
        .querySelectorAll('#parcel-data .parcel')
        .forEach(function(parcel) {

            var status =
                parcel.dataset.status;

            var color =
                getParcelColor(status);


            // Get parcel coordinates
var latitude = parseFloat(parcel.dataset.latitude);
var longitude = parseFloat(parcel.dataset.longitude);

var boundaryData = parcel.dataset.boundary;
var mapObject = null;

// ======================================
// SHOW BOUNDARY IF AVAILABLE
// ======================================

if (
    boundaryData &&
    boundaryData !== 'None' &&
    boundaryData !== 'null' &&
    boundaryData.trim() !== ''
) {

    try {

        var polygonCoordinates =
            JSON.parse(boundaryData);

        if (
            Array.isArray(polygonCoordinates) &&
            polygonCoordinates.length > 0
        ) {

            mapObject = L.polygon(
                polygonCoordinates,
                {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.25,
                    weight: 3,
                    opacity: 1,
                    dashArray: '8, 6',
                }
            ).addTo(map);

        }

    } catch (error) {

        console.warn(
            'Invalid boundary for parcel:',
            parcel.dataset.parcelId,
            error
        );

    }
}

// ======================================
// FALLBACK: SHOW POINT LOCATION
// ======================================

if (
    !mapObject &&
    !isNaN(latitude) &&
    !isNaN(longitude)
) {

    mapObject = L.circleMarker(
        [latitude, longitude],
        {
            radius: 9,
            color: color,
            fillColor: color,
            fillOpacity: 0.85,
            weight: 3
        }
    ).addTo(map);

}


            // ======================================
            // HOVER EFFECT
            // ======================================

            if (mapObject) {

    mapObject.on('mouseover', function() {

        mapObject.setStyle({
            fillOpacity: 0.7,
            weight: 4
        });

    });


    mapObject.on('mouseout', function() {

        mapObject.setStyle({
            fillOpacity: 0.45,
            weight: 3
        });

    });

}

            // ======================================
            // POPUP
            // ======================================

          if (mapObject) {
    mapObject.bindPopup(`

    <div class="parcel-popup">

        <b>Parcel ID:</b>
        ${parcel.dataset.parcelId}

        <br>

        <b>Owner:</b>
        ${parcel.dataset.owner}

        <br>

        <b>Area:</b>
        ${parcel.dataset.area} acres

        <hr>

        <b>Acquisition Status:</b>

        <span
            class="status-badge"
            style="background:${color}; color:white; padding:4px 8px; border-radius:5px;"
        >
            ${status}
        </span>

        <hr>

        <b>Compensation</b>

        <br>

        Assessed:
        ₹${Number(parcel.dataset.assessed).toLocaleString('en-IN')}

        <br>

        Paid:
        ₹${Number(parcel.dataset.paid).toLocaleString('en-IN')}

        <br>

        Payment:
        ${parcel.dataset.paymentStatus}

        <hr>

        <b>Possession</b>

        <br>

        Status:
        ${parcel.dataset.possessionStatus}

        <br>

        Date:
        ${parcel.dataset.possessionDate}

        <hr>

        <b>Project R&R</b>

        <br>

        R&R Cases:
        ${parcel.dataset.rrCount}

    </div>

`);
}


           if (mapObject) {
    allParcels.push(mapObject);
}

        });


    // ==========================================
    // FIT MAP TO PARCELS
    // ==========================================

    if (allParcels.length > 0) {

        var group =
            L.featureGroup(allParcels);

        map.fitBounds(
            group.getBounds(),
            {
                padding: [30, 30]
            }
        );

    }


    // ==========================================
    // LEGEND
    // ==========================================

    var legend =
        L.control({
            position: 'bottomright'
        });


    legend.onAdd = function(map) {

        var div =
            L.DomUtil.create(
                'div',
                'info legend'
            );

        div.style.background = 'white';
        div.style.padding = '15px';
        div.style.borderRadius = '8px';
        div.style.boxShadow =
            '0 2px 10px rgba(0,0,0,0.25)';

        div.innerHTML = `

            <b>Land Acquisition Status</b>

            <br><br>

            <span style="
                display:inline-block;
                width:14px;
                height:14px;
                background:#f1c40f;
                margin-right:6px;
            "></span>
            Identified

            <br>

            <span style="
                display:inline-block;
                width:14px;
                height:14px;
                background:#3498db;
                margin-right:6px;
            "></span>
            Verified

            <br>

            <span style="
                display:inline-block;
                width:14px;
                height:14px;
                background:#f39c12;
                margin-right:6px;
            "></span>
            Notified

            <br>

            <span style="
                display:inline-block;
                width:14px;
                height:14px;
                background:#ff1744;
                margin-right:6px;
            "></span>
            Acquired

            <br>

            <span style="
                display:inline-block;
                width:14px;
                height:14px;
                background:#8e44ad;
                margin-right:6px;
            "></span>
            Possession Taken

        `;

        return div;

    };


    legend.addTo(map);

</script>

</body>
</html>
